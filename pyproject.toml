[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ragkb"
version = "0.1.0"
description = "Enterprise RAG knowledge base: upload a corpus, vectorize it locally, get readable cited answers powered by your own Claude or ChatGPT subscription."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "lancedb>=0.25",
    "fastembed>=0.5",
    "pypdf>=4.2",
    "python-docx>=1.1",
    "beautifulsoup4>=4.12",
    "markdown-it-py>=3.0",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "mcp>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
ragkb = "ragkb.cli:main"

[tool.setuptools.packages.find]
include = ["ragkb*"]

[tool.setuptools.package-data]
ragkb = ["ui/*", "ui/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
